spring:
  application:
    name: settlement-reconciliation
  flyway:
    # Flyway creates the schema on first run, as the role it connects with, so recon_migrator owns
    # the schema and everything in it. Its history table lives there too.
    schemas: recon
    default-schema: recon
    # Migrations need DDL and the application must not have it, so they run as recon_migrator on a
    # connection of their own and the application's pool never holds those rights. The password is
    # set per profile, like the datasource's.
    user: recon_migrator
  kafka:
    consumer:
      # The projection is derived from the topic, so a new consumer group reads it from the start;
      # replaying it is harmless because the insert skips a known event id (NFR-REL-3).
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Bytes: the parser decodes strict UTF-8 itself, and a dead letter keeps the bytes that arrived.
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      # A polled batch is projected in one transaction, then acknowledged once, and the offset is
      # committed only after that acknowledgement (FR-LED-4).
      type: batch
      ack-mode: manual
    producer:
      # The only producer here writes the dead-letter topic, a record at a time, and the consumer
      # waits for each write before it commits its offset. acks=all with idempotence means an
      # acknowledged dead letter is on every in-sync replica and a producer retry is not a second copy.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Bytes, so a dead letter carries the original value exactly as it arrived, even when it is not
      # valid UTF-8, which is one reason a record is dead-lettered.
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true

server:
  # Loopback only. Nothing here is meant to be reached from another machine, and 8090 keeps clear
  # of the ledger's 8080 so both services can run side by side on one host (TDD 5.1.1).
  address: 127.0.0.1
  port: 8090

management:
  server:
    # Actuator on a connector of its own, also loopback only; 8091 keeps clear of the ledger's 8081.
    address: 127.0.0.1
    port: 8091
  endpoints:
    web:
      exposure:
        # These three and nothing else over HTTP (CLAUDE.md 3.2). env, configprops, heapdump and
        # the rest read out configuration, credentials and memory, and a loopback address is not a
        # reason to publish them.
        include: health, info, prometheus

recon:
  # TDD 6: a ledger entry's value date is the date its created_at falls on in this zone. Snapshotted
  # onto each run from Phase 5 (FR-MAT-8).
  value-date-zone: Europe/Istanbul
  # TDD 8.1. Ledger entries are stored only for accounts listed here (FR-LED-2). Empty until OQ-3
  # settles which ledger account a PSP clears through; no such account exists in any ledger yet.
  sources: []
