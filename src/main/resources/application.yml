spring:
  application:
    name: settlement-reconciliation
  flyway:
    # Flyway creates the schema on first run, as the role it connects with, so recon_migrator owns
    # the schema and everything in it. Its history table lives there too.
    schemas: recon
    default-schema: recon
    # Migrations need DDL and the application must not have it, so they run as recon_migrator on a
    # connection of their own and the application's pool never holds those rights. The password is
    # set per profile, like the datasource's.
    user: recon_migrator
  kafka:
    consumer:
      # The projection is derived from the topic, so a new consumer group reads it from the start;
      # replaying it is harmless because the insert skips a known event id (NFR-REL-3).
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Bytes: the parser decodes strict UTF-8 itself, and a dead letter keeps the bytes that arrived.
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      # A polled batch is projected in one transaction, then acknowledged once, and the offset is
      # committed only after that acknowledgement (FR-LED-4).
      type: batch
      ack-mode: manual
    producer:
      # The only producer here writes the dead-letter topic, a record at a time, and the consumer
      # waits for each write before it commits its offset. acks=all with idempotence means an
      # acknowledged dead letter is on every in-sync replica and a producer retry is not a second copy.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Bytes, so a dead letter carries the original value exactly as it arrived, even when it is not
      # valid UTF-8, which is one reason a record is dead-lettered.
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true

server:
  # Loopback only. Nothing here is meant to be reached from another machine, and 8090 keeps clear
  # of the ledger's 8080 so both services can run side by side on one host (TDD 5.1.1).
  address: 127.0.0.1
  port: 8090

management:
  server:
    # Actuator on a connector of its own, also loopback only; 8091 keeps clear of the ledger's 8081.
    address: 127.0.0.1
    port: 8091
  endpoints:
    web:
      exposure:
        # These three and nothing else over HTTP (CLAUDE.md 3.2). env, configprops, heapdump and
        # the rest read out configuration, credentials and memory, and a loopback address is not a
        # reason to publish them.
        include: health, info, prometheus

recon:
  # TDD 11.1: HTTP Basic users, one per role, from the environment. No default: an unset variable
  # stops startup. The hash is bcrypt; .env.example says how to make one.
  security:
    operator:
      username: ${RECON_OPERATOR_USERNAME}
      password-hash: ${RECON_OPERATOR_PASSWORD_HASH}
    viewer:
      username: ${RECON_VIEWER_USERNAME}
      password-hash: ${RECON_VIEWER_PASSWORD_HASH}
  # TDD 6: a ledger entry's value date is the date its created_at falls on in this zone. Snapshotted
  # onto each run from Phase 5 (FR-MAT-8).
  value-date-zone: Europe/Istanbul
  # TDD 6: TRY alone, matching the ledger. A ledger entry in another real ISO 4217 currency is still
  # projected, warned about and counted: it is money that moved on a mapped account.
  supported-currencies: [ TRY ]
  # FR-ING-7, FR-ING-8: statement uploads. Each limit is set here once, for whichever part of the
  # application enforces it.
  ingestion:
    # The largest file an upload may carry. The servlet container refuses a larger one with 413 while
    # it is still arriving, so it is never written out in full.
    max-file-size: 200MB
    # Where the servlet container keeps an upload, under a name of its own, until the request ends.
    temp-directory: ${java.io.tmpdir}/settlement-reconciliation/uploads
    # The longest line, in bytes, not counting its ending. A longer one is LINE_TOO_LONG.
    max-line-length: 4KB
    # The most data lines a file may have. The first line over it refuses the file with 413.
    max-lines: 2000000
    # Invalid lines a file may have and still be ingested, in basis points of its data lines (100 is
    # 1 %). 0: any invalid line rejects the file. An integer, since no floating point is used (INV-8).
    max-invalid-line-ratio-bp: 0
  # TDD 8.1. Ledger entries are stored only for accounts listed here (FR-LED-2). Empty until OQ-3
  # settles which ledger account a PSP clears through; no such account exists in any ledger yet.
  # A PSP source's value-date-window-days, grace-days-ledger-unmatched and grace-days-psp-unmatched
  # are 2, 3 and 1 business days unless it sets its own.
  sources: []
  # TDD 8.1: value-date windows and grace periods count every day except these. Holidays are ISO
  # dates. Both are snapshotted onto each run (FR-MAT-8).
  business-calendar:
    weekend: [ SATURDAY, SUNDAY ]
    holidays: [ ]
