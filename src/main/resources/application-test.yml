# Tests start their own PostgreSQL through Testcontainers and register its address and the
# passwords generated for it at runtime (support/ReconPostgres), so this profile holds no
# credentials and never reads .env.

spring:
  datasource:
    hikari:
      # Test contexts are cached for the whole run, each with its own pool, and all of them share one
      # PostgreSQL that admits 100 connections. Hikari's default of ten kept open per context runs
      # out of slots once a run has a dozen contexts; four at most, and one once a context is idle,
      # leaves room for many more.
      maximum-pool-size: 4
      minimum-idle: 1
      idle-timeout: 10000
  kafka:
    # Most test contexts have no broker. Without these the admin client would try to create the
    # dead-letter topic at startup, and the listener to poll, against an address where nothing
    # listens. support/ReconKafka switches topic creation back on for a context with a broker, and
    # the listener only for a context that consumes.
    admin:
      auto-create: false
    listener:
      auto-startup: false

server:
  # A test context never takes the fixed ports a locally running instance already holds.
  port: 0

management:
  server:
    port: 0
