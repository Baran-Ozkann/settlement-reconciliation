services:
  postgres:
    image: postgres:16-alpine
    security_opt:
      - no-new-privileges:true
    environment:
      # The image's superuser. Only the init script below uses it, to create the two roles and the
      # database; neither Flyway nor the application ever connects as it.
      POSTGRES_USER: recon_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?set POSTGRES_BOOTSTRAP_PASSWORD in .env}
      RECON_DB_MIGRATOR_PASSWORD: ${RECON_DB_MIGRATOR_PASSWORD:?set RECON_DB_MIGRATOR_PASSWORD in .env}
      RECON_DB_APP_PASSWORD: ${RECON_DB_APP_PASSWORD:?set RECON_DB_APP_PASSWORD in .env}
    # Loopback only, like every published port here: without the 127.0.0.1 prefix Docker publishes
    # on every interface. 5434 keeps clear of a native PostgreSQL on 5432 and the ledger's 5433.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only on an empty data directory, which is the only time the roles need creating.
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon_bootstrap -d recon"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # A broker of our own rather than the ledger's (docs/ledger-integration-notes.md section 9), so
  # this stack starts without the ledger's. Tests never use it: they start their own through
  # Testcontainers.
  kafka:
    image: apache/kafka:4.3.1
    security_opt:
      - no-new-privileges:true
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # The broker listens on the same port it is published on, so the address it advertises works
      # from the host and from inside the container alike; the healthcheck depends on the second.
      # 9094 keeps clear of the ledger's broker on 9092.
      KAFKA_LISTENERS: HOST://:${KAFKA_PORT:-9094},CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: HOST
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # A base64-encoded 16-byte id, the form the storage format expects.
      CLUSTER_ID: cmVjb24tbG9jYWwtMDAwMQ
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9094}:${KAFKA_PORT:-9094}"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:${KAFKA_PORT:-9094} >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
  kafka-data:
